AWSTemplateFormatVersion: 2010-09-09
Description: Deploys the narrowly scoped role used by central CodeBuild to deploy and collect AIML Security Assessment reports in member accounts.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Trust Configuration
        Parameters:
          - ManagementAccountID
    ParameterLabels:
      ManagementAccountID:
        default: Central assessment account ID

Parameters:
  ManagementAccountID:
    Description: >
      The 12-digit AWS account ID where the multi-account AIML Security
      Assessment CodeBuild project runs. This can be the AWS Organizations
      management account or a delegated administrator/central tooling account.
    Type: String
    AllowedPattern: "^\\d{12}$"
    ConstraintDescription: Enter a 12-digit AWS account ID with no spaces.

Resources:
  MemberRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      RoleName: AIMLSecurityMemberRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${ManagementAccountID}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${ManagementAccountID}:role/service-role/MultiAccountCodeBuildRole

  # Assessment API calls run under SAM-created Lambda execution roles. This role
  # is assumed only by the central CodeBuild project for deployment, execution
  # polling, and report retrieval.
  MemberRoleDeploymentAndReportPermissions:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Deploy assessment resources, poll executions, and retrieve assessment reports.
      ManagedPolicyName: AIMLSecurityAssessmentDeploymentPermissions
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFormationAssessmentStacks
            Effect: Allow
            Action:
              # CreateStack is required when the SAM change set creates a new
              # assessment or aws-sam-cli-managed-default stack.
              - cloudformation:CreateStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:GetTemplateSummary
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
            Resource:
              - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aiml-security-*/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aiml-sec-*/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:changeSet/samcli-deploy*/*"
              - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:changeSet/InitialCreation/*"
          - Sid: CloudFormationServerlessTransform
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31"
          - Sid: AssessmentLambdaFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
            Resource: !Sub "arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:aiml-security-*"
          - Sid: AssessmentRoleLifecycle
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-security-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-sec-*"
          - Sid: AssessmentRoleBasicLoggingPolicy
            Effect: Allow
            Action:
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-security-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-sec-*"
            Condition:
              ArnEquals:
                iam:PolicyARN: !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
          - Sid: PassAssessmentRolesOnlyToRuntimeServices
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-security-*"
              - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aiml-sec-*"
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - states.amazonaws.com
          - Sid: AssessmentStateMachines
            Effect: Allow
            Action:
              - states:CreateStateMachine
              - states:DeleteStateMachine
              - states:DescribeStateMachine
              - states:UpdateStateMachine
              - states:TagResource
              - states:UntagResource
              - states:StartExecution
              - states:DescribeExecution
            Resource:
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:stateMachine:aiml-security-*"
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:stateMachine:aiml-sec-*"
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:stateMachine:AIMLAssessmentStateMachine-*"
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:execution:aiml-security-*:*"
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:execution:aiml-sec-*:*"
              - !Sub "arn:${AWS::Partition}:states:*:${AWS::AccountId}:execution:AIMLAssessmentStateMachine-*:*"
          - Sid: AssessmentAndSamBucketConfiguration
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketVersioning
              - s3:GetBucketVersioning
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:PutEncryptionConfiguration
              - s3:GetEncryptionConfiguration
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::aiml-security-*"
              - !Sub "arn:${AWS::Partition}:s3:::aiml-sec-*"
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*"
          - Sid: SamArtifactBucketInventory
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*"
          - Sid: SamArtifactObjects
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-*/*"
          - Sid: AssessmentReportInventory
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::aiml-security-*"
              - !Sub "arn:${AWS::Partition}:s3:::aiml-sec-*"
          - Sid: AssessmentReportRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::aiml-security-*/*"
              - !Sub "arn:${AWS::Partition}:s3:::aiml-sec-*/*"
      Roles:
        - !Ref MemberRole

Outputs:
  MemberRoleArn:
    Description: ARN of the AIML Security Member Role
    Value: !GetAtt MemberRole.Arn
