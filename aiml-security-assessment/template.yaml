            - Sid: OrganizationsInventoryPermissions
              Effect: Allow
              Action:
                - organizations:ListPolicies
              Resource: '*'
            - Sid: OrganizationsPolicyRead
              Effect: Allow
              Action:
                - organizations:DescribePolicy
              Resource:
                - !Sub 'arn:${AWS::Partition}:organizations::*:policy/*/*/*'
                - !Sub 'arn:${AWS::Partition}:organizations::aws:policy/*/*'
            - Sid: ECRPermissions
              Effect: Allow
              Action:
                - ecr:DescribeRepositories
              Resource: !Sub 'arn:${AWS::Partition}:ecr:*:${AWS::AccountId}:repository/*'
            - Sid: InspectorPermissions
              Effect: Allow
              Action:
                - inspector2:BatchGetAccountStatus # FS-16
              Resource: '*'
            - Sid: OpenSearchServerlessPermissions
              Effect: Allow
              Action:
