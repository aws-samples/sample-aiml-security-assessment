# ... (Encabezado igual al original)
      DefinitionSubstitutions:
        # ... (sustituciones base)
        OWASPSecurityAssessmentFunction: !GetAtt OWASPSecurityAssessmentFunction.Arn
        HIPAASecurityAssessmentFunction: !GetAtt HIPAASecurityAssessmentFunction.Arn
        GenerateConsolidatedReportFunction: !GetAtt GenerateConsolidatedReportFunction.Arn
        AIMLAssessmentBucketName: !Ref AIMLAssessmentBucket
        MaxRegionConcurrency: !Ref MaxRegionConcurrency
      Policies:
        # ... (políticas base)
        - LambdaInvokePolicy:
            FunctionName: !Ref OWASPSecurityAssessmentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref HIPAASecurityAssessmentFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref GenerateConsolidatedReportFunction
# ...
  HIPAASecurityAssessmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'aiml-security-${AWS::StackName}-HIPAASecurityAssessment'
      CodeUri: functions/security/hipaa_assessments/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          AIML_ASSESSMENT_BUCKET_NAME: !Ref AIMLAssessmentBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AIMLAssessmentBucket
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:ListCustomModels
                - bedrock:GetCustomModel
                - bedrock:ListGuardrails
                - bedrock:GetGuardrail
                - sagemaker:ListEndpoints
                - sagemaker:DescribeEndpoint
                - sagemaker:DescribeEndpointConfig
                - sagemaker:ListTrainingJobs
                - sagemaker:DescribeTrainingJob
                - ec2:DescribeVpcEndpoints
                - logs:DescribeLogGroups
                - logs:GetDataProtectionPolicy
              Resource: "*"
