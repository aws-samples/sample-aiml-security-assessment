name: ASH Full Repository Scan

on:
  push:
    branches: [ main ]
  schedule:
    # Run at 2 AM UTC on the 1st of every month
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install ASH
        run: pip install git+https://github.com/awslabs/automated-security-helper.git@v3.2.6

      - name: Run ASH full repository scan
        # pipefail is required: without it the step reports tee's exit status,
        # so a failing scan looks green. continue-on-error was also removed —
        # a security scan that cannot fail the build is not a gate.
        run: |
          set -o pipefail
          ash --mode container 2>&1 | tee ash-output.log

      - name: Generate scan summary
        run: |
          echo "# ASH Full Repository Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date:** $(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "ash-output.log" ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 ash-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ash-full-scan-results
          path: ash-output.log
          retention-days: 30
