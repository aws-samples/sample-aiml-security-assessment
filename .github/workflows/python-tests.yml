name: AI/ML Security Assessment Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "aiml-security-assessment/functions/security/**"
      - "tests/**"
      - "assessment_history/**"
      - "consolidate_html_reports.py"
      - "tests/test_consolidate_responsible_ai_grc.py"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "aiml-security-assessment/functions/security/**"
      - "tests/**"
      - "assessment_history/**"
      - "consolidate_html_reports.py"
      - "tests/test_consolidate_responsible_ai_grc.py"
      - ".github/workflows/python-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          # Install pydantic for schema validation used by Lambda functions
          pip install pydantic>=2.0.0

      - name: Run upstream tests with coverage
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=aiml-security-assessment/functions/security \
            --cov-report=term-missing

      - name: Run Responsible AI GRC assessment tests with coverage
        # Run separately from tests/: the Responsible AI GRC suite has its own
        # conftest and imports the app as top-level `app`, which would collide
        # in a single pytest session with the other assessment modules' app.py
        # files.
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest aiml-security-assessment/functions/security/responsible_ai_grc_tests/ \
            -v \
            --tb=short \
            --cov=aiml-security-assessment/functions/security \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run report-pipeline tests
        # The single- and multi-account HTML report generators (REQ-1) and the
        # Responsible AI GRC categorization test. The report generator package
        # ships an __init__.py, so its tests run with that directory as CWD.
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest tests/test_consolidate_responsible_ai_grc.py -v --tb=short
          cd aiml-security-assessment/functions/security/generate_consolidated_report
          python -m pytest test_generate_report.py -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
