name: AI/ML Security Assessment Tests

# Least privilege. This workflow only reads the repository and uploads an
# artifact, so it needs no write scopes. Five of the seven workflows already
# declared this; python-tests.yml did not, which checkov CKV2_GHA_1 flags as an
# implicit write-all token.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths: &test-paths
      - "aiml-security-assessment/functions/security/**"
      - "tests/**"
      - "consolidate_html_reports.py"
      - "generate_provenance.py"
      # Tests assert against these, so a change here must run the suite:
      # test_legacy_contracts.py parses both templates and the state machine,
      # and the docs are the source for provenance.json.
      - "aiml-security-assessment/template.yaml"
      - "aiml-security-assessment/template-multi-account.yaml"
      - "aiml-security-assessment/statemachine/**"
      - "deployment/**"
      - "buildspec.yml"
      - "docs/**"
      - "ruff.toml"
      - ".github/workflows/python-tests.yml"
  pull_request:
    branches: [main]
    paths: *test-paths

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          # Install pydantic for schema validation used by Lambda functions.
          # Quoting is required: unquoted, `>=` is a shell redirect, so this
          # wrote a file named "=2.0.0" and installed pydantic UNCONSTRAINED.
          # The upper bound must match the Lambda requirement, or CI can pass
          # against a pydantic major the runtime forbids.
          pip install 'pydantic>=2.0.0,<3.0.0'

      - name: Run upstream tests with coverage
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=aiml-security-assessment/functions/security \
            --cov-report=term-missing

      - name: Run FinServ assessment tests with coverage
        # Run separately from tests/: the FinServ suite has its own conftest and
        # imports the FinServ app as top-level `app`, which would collide in a
        # single pytest session with the other assessment modules' app.py files.
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest aiml-security-assessment/functions/security/finserv_tests/ \
            -v \
            --tb=short \
            --cov=aiml-security-assessment/functions/security \
            --cov-append \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run report-pipeline tests
        # The single- and multi-account HTML report generators (REQ-1) and the
        # FinServ categorization test. The report generator package ships an
        # __init__.py, so its tests run with that directory as CWD.
        env:
          AIML_ASSESSMENT_BUCKET_NAME: test-assessment-bucket
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing  # pragma: allowlist secret
        run: |
          python -m pytest tests/test_consolidate_finserv.py -v --tb=short
          cd aiml-security-assessment/functions/security/generate_consolidated_report
          python -m pytest test_generate_report.py -v --tb=short

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml
